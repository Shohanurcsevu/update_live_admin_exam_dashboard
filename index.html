<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- MODIFIED: Added Cropper.js and Confetti Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/sidebar-premium.css">
    <link rel="stylesheet" href="assets/css/streak-effects.css">
    <link rel="stylesheet" href="assets/css/study-target.css">
    <!-- Google Fonts & Icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>

<body class="bg-gray-100 font-[Inter] flex h-screen overflow-hidden">

    <!-- Sidebar container -->
    <div id="sidebar-container" class="w-0 md:w-72 flex-shrink-0 z-[200]"></div>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header container -->
        <div id="header-container" class="flex-shrink-0 sticky top-0 z-[110]"></div>

        <!-- Dynamic Page Content -->
        <main id="main-content" class="p-4 md:p-6 lg:p-8 pb-8 flex-1 overflow-y-auto">
            <!-- Content from pages will be loaded here -->
        </main>
    </div>

    <!-- COMPACT SOFT GRADIENT PRINT STUDIO -->
    <div id="print-options-modal"
        class="fixed inset-0 bg-slate-950/20 hidden items-center justify-center z-[300] backdrop-blur-md p-4">

        <div
            class="bg-white border border-slate-100 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.1)] w-full max-w-md relative overflow-hidden animate-scale-up">

            <!-- Header -->
            <div class="p-6 pb-0 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-100">
                        <span class="material-symbols-outlined text-white text-xl">layers</span>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800 tracking-tight">PDF Question Generator</h2>
                    </div>
                </div>
                <button type="button" id="close-print-modal"
                    class="w-8 h-8 rounded-full border border-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-all"
                    title="Close">
                    <span class="material-symbols-outlined text-sm">close</span>
                </button>
            </div>

            <!-- Scrollable Content Section -->
            <div class="p-6 max-h-[80vh] overflow-y-auto custom-scrollbar space-y-6">

                <!-- Presets at Top -->
                <div>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-4 px-1">Studio
                        Presets</span>
                    <div class="grid grid-cols-4 gap-2">
                        <!-- BCS Preset -->
                        <div class="flex flex-col items-center group cursor-pointer"
                            onclick="window.applyExamPreset('BCS')">
                            <div
                                class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center transition-all group-hover:scale-110 group-hover:shadow-lg group-hover:shadow-indigo-100 active:scale-95">
                                <span class="material-symbols-outlined text-lg">auto_awesome_motion</span>
                            </div>
                            <span
                                class="text-[8px] font-bold text-slate-500 mt-2 text-center uppercase tracking-widest">BCS</span>
                        </div>

                        <!-- Primary Preset -->
                        <div class="flex flex-col items-center group cursor-pointer"
                            onclick="window.applyExamPreset('Primary')">
                            <div
                                class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center transition-all group-hover:scale-110 group-hover:shadow-lg group-hover:shadow-emerald-100 active:scale-95">
                                <span class="material-symbols-outlined text-lg">history_edu</span>
                            </div>
                            <span
                                class="text-[8px] font-bold text-slate-500 mt-2 text-center uppercase tracking-widest">PRIMARY</span>
                        </div>

                        <!-- Bank Preset -->
                        <div class="flex flex-col items-center group cursor-pointer"
                            onclick="window.applyExamPreset('Bank')">
                            <div
                                class="w-12 h-12 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center transition-all group-hover:scale-110 group-hover:shadow-lg group-hover:shadow-purple-100 active:scale-95">
                                <span class="material-symbols-outlined text-lg">account_balance</span>
                            </div>
                            <span
                                class="text-[8px] font-bold text-slate-500 mt-2 text-center uppercase tracking-widest">BANK</span>
                        </div>

                        <!-- Clear -->
                        <div class="flex flex-col items-center group cursor-pointer"
                            onclick="window.applyExamPreset('Clear')">
                            <div
                                class="w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center transition-all group-hover:scale-110 group-hover:shadow-lg group-hover:shadow-rose-100 active:scale-95">
                                <span class="material-symbols-outlined text-lg">restart_alt</span>
                            </div>
                            <span
                                class="text-[8px] font-bold text-slate-500 mt-2 text-center uppercase tracking-widest">CLEAR</span>
                        </div>
                    </div>
                </div>

                <!-- Parameters -->
                <div class="space-y-3.5">
                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-3">
                            <label
                                class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 px-1">Exam
                                Title</label>
                            <input type="text" id="print-custom-title"
                                class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-2.5 text-xs font-bold text-slate-700 outline-none focus:border-indigo-300 focus:ring-4 focus:ring-indigo-500/5 transition-all"
                                placeholder="e.g. BCS Preliminary" value="প্রিলিমিনারি টেস্ট">
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 px-1">Session</label>
                            <input type="text" id="print-custom-year"
                                class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-2.5 text-xs font-bold text-slate-700 outline-none focus:border-indigo-300 focus:ring-4 focus:ring-indigo-500/5 transition-all"
                                placeholder="2026" value="2026">
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 px-1">Marks</label>
                            <input type="text" id="print-custom-marks"
                                class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-2.5 text-xs font-bold text-slate-700 outline-none focus:border-indigo-300 focus:ring-4 focus:ring-indigo-500/5 transition-all"
                                placeholder="Auto" value="From JSON">
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 px-1">Duration</label>
                            <input type="text" id="print-custom-time"
                                class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-2.5 text-xs font-bold text-slate-700 outline-none focus:border-indigo-300 focus:ring-4 focus:ring-indigo-500/5 transition-all"
                                placeholder="Auto" value="From JSON">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div
                            class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                            <div class="flex-1">
                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Question
                                    Start From</p>
                                <input type="number" id="print-start-num" value="1" min="1"
                                    class="bg-transparent text-sm font-bold text-indigo-600 outline-none w-full text-left">
                            </div>
                        </div>

                        <div
                            class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                            <div>
                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Shuffle
                                    options</p>
                                <span class="text-[8px] font-bold text-slate-500 uppercase">ক-ঘ</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="print-shuffle-options" checked class="sr-only peer">
                                <div
                                    class="w-8 h-4 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-600">
                                </div>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 px-1">Special
                            Instructions</label>
                        <textarea id="print-custom-instructions" rows="2"
                            class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-2 text-[11px] font-medium text-slate-600 outline-none focus:border-indigo-300 focus:ring-4 focus:ring-indigo-500/5 transition-all resize-none custom-scrollbar"
                            placeholder="Add metadata or notes..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Final Synthesis Action -->
            <div class="pt-2">
                <button type="button" id="generate-pdf-btn"
                    class="w-full bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white rounded-2xl h-14 flex items-center justify-center gap-3 shadow-xl shadow-indigo-100 hover:shadow-indigo-200 transition-all font-bold uppercase tracking-widest text-xs active:scale-[0.98]">
                    Print
                </button>
            </div>
        </div>
    </div>
    </div>

    <!-- PRINT ENGINE STYLES (Screen Hidden) -->
    <style>
        /* Custom Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scaleUp {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .animate-scale-up {
            animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Premium Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        #print-container {
            display: none;
        }

        @media print {
            @page {
                size: A4;
                margin: 0;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body * {
                visibility: hidden;
            }

            #print-container,
            #print-container * {
                visibility: visible;
            }

            #print-container {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background-color: white;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .page-content-wrapper {
                padding: 25mm 20mm;
                box-sizing: border-box;
                width: 210mm;
                min-height: 297mm;
                overflow: visible;
            }

            .exam-text {
                font-family: 'Kalpurush', 'Nirmala UI', sans-serif;
                color: #000;
            }

            .cover-page {
                position: relative;
                height: 297mm;
                width: 210mm;
                box-sizing: border-box;
            }

            .cover-page+.page-content-wrapper {
                break-before: page;
                page-break-before: always;
            }

            .set-info-top {
                position: absolute;
                top: 30mm;
                left: 0;
                width: 100%;
                display: flex;
                justify-content: space-between;
                padding: 0 25mm;
                font-weight: bold;
                font-size: 12pt;
            }

            .set-info-top .set-number {
                text-align: left;
            }

            .set-info-top .code-name {
                text-align: right;
            }

            .exam-title-block {
                position: absolute;
                top: 80mm;
                left: 0;
                width: 100%;
                text-align: center;
            }

            .exam-title-block h1 {
                font-size: 24pt;
                color: #000;
                margin: 0 0 5mm 0;
            }

            .exam-year {
                font-size: 18pt;
                font-weight: bold;
                margin: 0;
            }

            .exam-meta {
                position: absolute;
                top: 140mm;
                left: 0;
                width: 100%;
                text-align: center;
                font-size: 14pt;
                font-weight: bold;
                margin: 0;
            }

            .instructions {
                position: absolute;
                top: 175mm;
                left: 25mm;
                right: 25mm;
                text-align: center;
                font-size: 10pt;
            }

            .instructions-divider {
                position: absolute;
                top: 230mm;
                left: 25mm;
                right: 25mm;
                height: 1pt;
                background-color: #000;
            }

            .instruction-note {
                position: absolute;
                top: 245mm;
                left: 25mm;
                right: 25mm;
                text-align: center;
                font-size: 11pt;
                margin: 0;
            }

            .questions-header {
                display: flex;
                justify-content: space-between;
                font-weight: bold;
                margin-bottom: 1rem;
                border-bottom: 1px solid #000;
                padding-bottom: 0.5rem;
            }

            .question-columns {
                column-count: 2;
                column-gap: 10mm;
                widows: 2;
                orphans: 2;
            }

            .question-item {
                break-inside: avoid;
                -webkit-column-break-inside: avoid;
                page-break-inside: avoid;
                display: inline-block;
                width: 100%;
                margin-bottom: 1rem;
                text-align: justify;
                font-size: 0.95rem;
            }

            .q-text {
                font-weight: bold;
                display: block;
                margin-bottom: 0.3rem;
            }

            .q-options {
                display: flex;
                gap: 0.5rem;
            }

            .q-options.horizontal {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
            }

            .q-options.vertical {
                flex-direction: column;
            }

            .q-opt {
                display: flex;
                gap: 0.4rem;
                align-items: baseline;
            }

            .answer-key-section {
                break-before: page;
                margin-top: 2rem;
            }

            .answer-header {
                text-align: center;
                font-size: 1.5rem;
                font-weight: bold;
                margin-bottom: 1.5rem;
            }

            .answer-grid {
                column-count: 5;
                column-gap: 1rem;
                font-size: 0.9rem;
            }

            .answer-item {
                break-inside: avoid;
                margin-bottom: 0.2rem;
            }

            .omr-section {
                break-before: page;
                margin-top: 0;
            }

            .omr-header {
                text-align: center;
                border-bottom: 2px solid #000;
                padding-bottom: 10px;
                margin-bottom: 20px;
            }

            .omr-grid-container {
                column-count: 4;
                column-gap: 15px;
                width: 100%;
            }

            .omr-row {
                break-inside: avoid;
                display: flex;
                align-items: center;
                margin-bottom: 8px;
                gap: 8px;
                font-family: sans-serif;
            }

            .omr-q-num {
                width: 30px;
                text-align: right;
                font-weight: bold;
                font-family: 'Kalpurush', sans-serif;
            }

            .omr-bubbles {
                display: flex;
                gap: 8px;
            }

            .omr-bubble {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                border: 1px solid #000;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
                color: #444;
            }
        }
    </style>

    <!-- PRINT CONTAINER -->
    <div id="print-container"></div>

    <!-- Core JavaScript -->
    <script src="assets/js/cache-manager.js"></script>
    <script src="assets/js/indexeddb-manager.js"></script>
    <script src="assets/js/sync-manager.js"></script>
    <script src="assets/js/streak-manager.js"></script>
    <script src="assets/js/print-engine.js"></script>
    <script src="assets/js/study-target.js"></script>
    <script src="assets/js/study-material-engine.js"></script>
    <script src="assets/js/question-utils.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/mentor.js"></script>
</body>

</html>
