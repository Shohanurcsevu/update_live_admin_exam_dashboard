<!-- Header -->
<header class="main-header relative z-[100]">
    <!-- Sidebar Toggle Button for Mobile -->
    <button id="sidebar-toggle" class="text-gray-600 hover:text-gray-800 md:hidden">
        <span class="material-symbols-outlined">menu</span>
    </button>

    <h1 class="hidden md:block text-xl font-bold text-gray-800">Dashboard</h1>

    <!-- Central Status Indicator (Ambulance/Grind Mode) -->
    <div id="global-header-status-indicator" class="flex-1 flex justify-center h-full"></div>

    <!-- User Profile Section -->
    <div class="flex items-center space-x-4">
        <!-- Daily Streak Counter -->
        <div id="streak-counter"
            class="hidden items-center px-3 py-1 bg-white hover:bg-gray-50 rounded-full border border-gray-100 shadow-sm cursor-pointer transition-all mr-2 relative group"
            title="Daily Streak: Complete an exam daily to increase your streak!">
            <div class="streak-ring-container">
                <svg class="streak-ring-svg" viewBox="0 0 36 36">
                    <circle class="streak-ring-bg" cx="18" cy="18" r="16"></circle>
                    <circle id="streak-ring-path" class="streak-ring-progress" cx="18" cy="18" r="16"
                        stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
                </svg>
                <canvas id="streak-ember-canvas" width="40" height="60"
                    style="position: absolute; top: -30px; left: -1px; pointer-events: none;"></canvas>
                <span id="streak-flame-icon"
                    class="material-symbols-outlined text-gray-400 text-xl relative z-10 transition-colors"
                    style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
            </div>
            <span id="streak-count" class="font-black text-sm text-gray-700 ml-1">0</span>

            <!-- Tooltip -->
            <div
                class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-2 bg-gray-800 text-white text-xs rounded-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none z-[110]">
                Daily Activity Streak
                <div class="absolute top-full left-1/2 -translate-x-1/2 border-8 border-transparent border-t-gray-800">
                </div>
            </div>
        </div>

        <!-- Notification Bell with Dropdown -->
        <div class="relative">
            <button id="notification-btn" class="relative text-gray-600 hover:text-gray-800">
                <span class="material-symbols-outlined">notifications</span>
                <span id="notification-dot"
                    class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-600 hidden"></span>
            </button>
            <div id="notification-panel"
                class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl overflow-hidden z-20 hidden">
                <div class="py-2 px-4 text-sm font-semibold text-gray-700 border-b">
                    Recent Activity
                </div>
                <div id="notification-list" class="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                    <p class="p-4 text-sm text-gray-500">No recent activity.</p>
                </div>
            </div>
        </div>

        <div class="relative">
            <img class="w-10 h-10 rounded-full cursor-pointer" src="https://placehold.co/40x40/E2E8F0/4A5568?text=A"
                alt="Admin Profile">
        </div>
    </div>
</header>
