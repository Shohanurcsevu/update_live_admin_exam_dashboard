<!-- Header -->
<header class="main-header relative z-[100] flex items-center px-4 py-2 bg-white border-b border-gray-100 h-14">
    <!-- Left Section: Toggle -->
    <div class="flex items-center min-w-fit md:min-w-[60px] flex-shrink-0">
        <button id="sidebar-toggle" class="text-gray-500 hover:text-indigo-600 transition-colors md:hidden mr-3">
            <span class="material-symbols-outlined text-2xl">menu</span>
        </button>
    </div>

    <!-- Smart Header Info Bar - Adaptive centering, Scrollable on tight space -->
    <div id="smart-header-bar"
        class="flex-1 flex justify-center items-center overflow-x-auto no-scrollbar gap-3 md:gap-4 px-2">

        <!-- Date Group with Countdown Numbers -->
        <div id="header-date-container" class="flex items-center gap-1.5 md:gap-3 flex-shrink-0">
            <!-- Day Group -->
            <div class="flex items-center gap-1">
                <div id="header-day-text" class="text-[12px] font-black text-slate-500 whitespace-nowrap">---</div>
                <span id="header-week-badge"
                    class="bg-emerald-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded shadow-sm hidden tabular-nums">0</span>
            </div>

            <div class="text-slate-200 hidden sm:block">/</div>

            <!-- Month Group -->
            <div class="flex items-center gap-1">
                <div id="header-month-text" class="text-[12px] font-black text-slate-700 whitespace-nowrap">---</div>
                <span id="header-month-badge"
                    class="bg-indigo-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded shadow-sm hidden tabular-nums">0</span>
            </div>
        </div>

        <div class="text-slate-200 hidden sm:block">•</div>

        <!-- Clock & Auto-Backup Status -->
        <div class="flex items-center gap-2 flex-shrink-0 relative group">
            <div id="header-clock" class="text-sm font-black text-slate-800 tabular-nums whitespace-nowrap">--:--:-- --
            </div>
            <div id="backup-pulse"
                class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)] cursor-help relative"
                title="Backup Status: Monitoring">
                <span class="absolute inset-0 rounded-full bg-inherit animate-ping opacity-75"></span>
            </div>
            <!-- Unsaved Changes Indicator (Blinking Status) -->
            <div id="unsaved-indicator" class="unsaved-glow cursor-help hidden transition-all duration-300"
                title="You have unsaved changes">
                <span class="absolute inset-0 rounded-full bg-amber-400 animate-ping opacity-60"></span>
            </div>
            <!-- Status Tooltip -->
            <div
                class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 p-2 bg-slate-800 text-white text-[10px] rounded shadow-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-[120] whitespace-nowrap">
                Backup: <span id="backup-status-text">Checking Status...</span>
            </div>
        </div>

        <div class="text-slate-200 hidden sm:block">•</div>

        <!-- Focus Timer Group -->
        <div id="header-focus-container" class="flex items-center gap-1.5 flex-shrink-0">
            <span class="material-symbols-outlined text-base text-slate-400">timer</span>
            <span id="header-focus-timer"
                class="text-[13px] font-black text-slate-600 uppercase tracking-tight tabular-nums">
                <span class="hidden sm:inline">Focus:</span> --:--</span>
        </div>

        <div class="text-slate-200 hidden md:block">•</div>

        <!-- Weather Snapshot -->
        <div id="header-weather" class="flex items-center gap-1.5 flex-shrink-0 cursor-help group relative">
            <span id="header-weather-icon" class="text-base">--</span>
            <span id="header-weather-temp" class="text-[13px] font-bold text-slate-700">--°C</span>
            <span id="header-weather-city" class="text-[11px] font-medium text-slate-400 hidden xl:block">---</span>

            <!-- Weather Tooltip -->
            <div
                class="absolute top-full left-0 mt-2 p-2 bg-slate-800 text-white text-[10px] rounded shadow-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-[120] whitespace-nowrap">
                Weather updated recently
            </div>
        </div>

        <div class="text-slate-200 hidden lg:block">•</div>

        <!-- Target Goal Countdown -->
        <div id="header-goal-container" class="flex items-center gap-2 flex-shrink-0">
            <div id="header-goal-display" class="flex items-center gap-1.5">
                <span class="material-symbols-outlined text-base text-indigo-500">ads_click</span>
                <span id="header-goal-countdown" class="text-[13px] font-bold text-indigo-600 tabular-nums">-- days
                    left</span>
            </div>
        </div>

    </div>

    <!-- Right Side Actions (Notifications & Profile) -->
    <div
        class="flex items-center gap-2 md:gap-4 ml-auto border-l border-slate-100 pl-2 md:pl-4 flex-shrink-0 relative z-[110]">
        <!-- Daily Streak Counter (Restored IDs for compatibility) -->
        <div id="streak-counter"
            class="hidden items-center px-2 py-1 bg-white hover:bg-slate-50 rounded-full border border-slate-200 shadow-sm cursor-pointer transition-all relative group"
            title="Daily Streak">
            <div class="streak-ring-container scale-[0.85] origin-center -ml-1">
                <svg class="streak-ring-svg" viewBox="0 0 36 36">
                    <circle class="streak-ring-bg" cx="18" cy="18" r="16"></circle>
                    <circle id="streak-ring-path" class="streak-ring-progress" cx="18" cy="18" r="16"
                        stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
                </svg>
                <canvas id="streak-ember-canvas" width="40" height="60"
                    style="position: absolute; top: -30px; left: -1px; pointer-events: none;"></canvas>
                <span id="streak-flame-icon"
                    class="material-symbols-outlined text-slate-400 text-2xl relative z-10 transition-colors"
                    style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
            </div>
            <span id="streak-count" class="font-black text-sm text-slate-700 ml-0.5 mr-1">0</span>
        </div>

        <!-- Search Toggle -->
        <button id="header-search-btn" class="text-slate-400 hover:text-indigo-600 transition-colors p-1"
            title="Quick Search (Ctrl+K)">
            <span class="material-symbols-outlined text-xl">search</span>
        </button>

        <!-- Notification Bell -->
        <div class="relative">
            <button id="notification-btn" class="relative text-slate-400 hover:text-indigo-600 transition-colors p-1">
                <span class="material-symbols-outlined text-xl">notifications</span>
                <span id="notification-count"
                    class="absolute -top-1 -right-1 h-4 min-w-[16px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-black flex items-center justify-center hidden border-2 border-white shadow-sm">0</span>
            </button>
            <!-- Panel is handled by main.js logic -->
            <div id="notification-panel"
                class="absolute right-0 mt-2 w-72 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-[200] hidden">
                <div class="p-3 border-b border-slate-50 flex items-center justify-between">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Recent Activity</span>
                </div>
                <div id="notification-list" class="max-h-80 overflow-y-auto no-scrollbar">
                    <p class="p-4 text-xs text-slate-400 text-center">No recent activity.</p>
                </div>
            </div>
        </div>

        <!-- Sound Toggle (Syncs with StudyMentor) -->
        <button id="header-sound-toggle" class="text-slate-400 hover:text-indigo-600 transition-colors p-1"
            title="Toggle Focus Sounds">
            <span class="material-symbols-outlined text-xl">volume_up</span>
        </button>

        <!-- Profile Image -->
        <div class="relative flex-shrink-0">
            <!-- Profile Avatar with Camera Overlay (Toggle Dropdown) -->
            <div class="relative cursor-pointer">
                <img id="header-profile-img" src="assets/img/profile.png" alt="Profile"
                    class="w-8 h-8 rounded-full border border-slate-200 transition-all hover:border-indigo-300">
            </div>
        </div>
    </div>
</header>
