<!-- Header -->
<header class="bg-white shadow-md p-4 flex justify-between items-center relative z-[100]">
    <!-- Sidebar Toggle Button for Mobile -->
    <button id="sidebar-toggle" class="text-gray-600 hover:text-gray-800 md:hidden">
        <span class="material-symbols-outlined">menu</span>
    </button>

    <h1 class="text-xl font-semibold text-gray-800">Dashboard</h1>

    <!-- User Profile Section -->
    <div class="flex items-center space-x-4">
        <!-- Streak Counter -->
        <div id="streak-container"
            class="flex items-center gap-1 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100 shadow-sm transition-transform hover:scale-105 cursor-help group relative"
            title="Daily Streak: Complete an exam daily to increase your streak!">
            <span id="streak-flame" class="material-symbols-outlined text-xl transition-colors duration-500 select-none"
                style="font-variation-settings: 'FILL' 1;">
                local_fire_department
            </span>
            <span id="streak-count" class="font-bold text-gray-700 text-sm select-none">0</span>

            <!-- Tooltip -->
            <div
                class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-2 bg-gray-800 text-white text-xs rounded-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none z-[110]">
                Daily Activity Streak
                <div class="absolute top-full left-1/2 -translate-x-1/2 border-8 border-transparent border-t-gray-800">
                </div>
            </div>
        </div>

        <!-- MODIFIED: Notification Bell with Dropdown -->
        <div class="relative">
            <button id="notification-btn" class="relative text-gray-600 hover:text-gray-800">
                <span class="material-symbols-outlined">notifications</span>
                <!-- Optional: Add a dot for new notifications -->
                <span id="notification-dot"
                    class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-600 hidden"></span>
            </button>
            <!-- Dropdown Panel -->
            <div id="notification-panel"
                class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl overflow-hidden z-20 hidden">
                <div class="py-2 px-4 text-sm font-semibold text-gray-700 border-b">
                    Recent Activity
                </div>
                <div id="notification-list" class="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                    <!-- Notifications will be injected here by JavaScript -->
                    <p class="p-4 text-sm text-gray-500">No recent activity.</p>
                </div>
            </div>
        </div>

        <div class="relative">
            <img class="w-10 h-10 rounded-full cursor-pointer" src="https://placehold.co/40x40/E2E8F0/4A5568?text=A"
                alt="Admin Profile">
        </div>
    </div>
</header>
