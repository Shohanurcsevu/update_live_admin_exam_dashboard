<!-- Toast Notification Container -->
<div id="toast-container" class="fixed top-5 right-5 z-[200]"></div>

<!-- Main Content -->
<div class="bg-white p-4 sm:p-6 pb-6 rounded-lg shadow-md">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 space-y-4 sm:space-y-0">
        <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
            Manage Topics
            <span id="total-topics-badge"
                class="px-2 py-0.5 bg-blue-100 text-blue-700 text-sm font-semibold rounded-full hidden">0</span>
        </h2>
        <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
            <button id="main-clear-filters-btn"
                class="flex items-center justify-center gap-2 px-4 py-2 bg-amber-100 text-amber-700 rounded-lg hover:bg-amber-200 transition font-bold text-sm shadow-sm">
                <span class="material-symbols-outlined text-lg">filter_alt_off</span>
                Clear Filters
            </button>
            <button id="create-topic-btn"
                class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow">
                <span class="material-symbols-outlined mr-2">add</span>
                Create Topic
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
            <label for="subject-filter" class="block text-sm font-medium text-gray-700">Filter by Subject</label>
            <select id="subject-filter"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></select>
        </div>
        <div>
            <label for="lesson-filter" class="block text-sm font-medium text-gray-700">Filter by Lesson</label>
            <select id="lesson-filter"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                disabled></select>
        </div>
    </div>

    <div class="overflow-x-auto">
        <table class="min-w-full bg-white">
            <thead class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                <tr>
                    <th class="py-3 px-6 text-left">Topic Name</th>
                    <th class="py-3 px-6 text-left hidden sm:table-cell">Lesson</th>
                    <th class="py-3 px-6 text-left hidden sm:table-cell">Subject</th>
                    <th class="py-3 px-4 text-center hidden sm:table-cell">Page</th>
                    <th class="py-3 px-4 text-center hidden sm:table-cell">Progress</th>
                    <th class="py-3 px-6 text-center">Actions</th>
                </tr>
            </thead>
            <tbody id="topics-table-body" class="text-gray-600 text-sm font-light"></tbody>
        </table>
    </div>
    <div id="load-more-container" class="mt-6 flex justify-center hidden">
        <button id="load-more-btn"
            class="px-6 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-lg transition-colors shadow-sm flex items-center gap-2">
            <span class="material-symbols-outlined">expand_more</span>
            Load More Topics
        </button>
    </div>
</div>

<!-- Add/Edit Topic Modal -->
<div id="topic-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-[200] p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center p-4 border-b">
            <h3 id="topic-modal-title" class="text-xl font-semibold">Add New Topic</h3>
            <button id="close-topic-modal-btn" class="text-gray-500 hover:text-gray-800"><span
                    class="material-symbols-outlined">close</span></button>
        </div>
        <!-- Modal Tabs -->
        <div class="flex px-6 border-b border-slate-100 bg-white sticky top-0 z-10">
            <button type="button" id="tab-manual"
                class="modal-tab px-4 py-3 text-xs font-black uppercase tracking-widest border-b-2 border-blue-600 text-blue-600 transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-lg">edit_note</span> Manual
            </button>
            <button type="button" id="tab-bulk"
                class="modal-tab px-4 py-3 text-xs font-black uppercase tracking-widest border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-lg">rocket_launch</span> Bulk JSON
            </button>
        </div>

        <form id="topic-form" class="p-6 space-y-4 overflow-y-auto">
            <input type="hidden" id="topic-id" name="id">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label for="modal-subject-selector"
                        class="block text-sm font-medium text-gray-700">Subject</label><select
                        id="modal-subject-selector" name="subject_id" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm"></select>
                </div>
                <div><label for="modal-lesson-selector"
                        class="block text-sm font-medium text-gray-700">Lesson</label><select id="modal-lesson-selector"
                        name="lesson_id" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm"
                        disabled></select></div>
            </div>
            <div id="manual-mode-content" class="space-y-4">
                <div>
                    <label for="topic-name" class="block text-sm font-medium text-gray-700">Topic Name</label>
                    <input type="text" id="topic-name" name="topic_name"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div><label for="start-page" class="block text-sm font-medium text-gray-700">Start
                            Page</label><input type="number" id="start-page" name="start_page"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></div>
                    <div><label for="end-page" class="block text-sm font-medium text-gray-700">End Page</label><input
                            type="number" id="end-page" name="end_page"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></div>
                    <div><label for="expected-exams" class="block text-sm font-medium text-gray-700">Expected
                            Exams</label><input type="number" id="expected-exams" name="expected_exams"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></div>
                </div>
            </div>

            <div id="bulk-mode-content" class="hidden space-y-4">
                <div class="space-y-2">
                    <label for="bulk-topics-json" class="block text-sm font-medium text-gray-700">JSON Topics
                        Array</label>
                    <div class="relative group">
                        <textarea id="bulk-topics-json" rows="6"
                            class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm font-mono text-xs focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-all outline-none"
                            placeholder='["Topic 1", "Topic 2", "Topic 3"]'></textarea>
                        <button type="button" id="bulk-init-queue-btn"
                            class="absolute bottom-4 right-4 px-4 py-2 bg-slate-900 hover:bg-black text-white rounded-lg font-bold shadow-xl transition-all flex items-center gap-2 transform active:scale-95">
                            <span class="material-symbols-outlined text-sm">rocket_launch</span>
                            <span>Init Queue</span>
                        </button>
                    </div>
                    <p class="text-[10px] text-gray-500 italic">Paste a JSON array of strings. Each string will be
                        created as a topic.</p>
                </div>

                <!-- Categorization Table Container -->
                <div id="bulk-categorization-container"
                    class="hidden border border-slate-100 rounded-xl overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="min-w-full bg-white text-xs">
                            <thead class="bg-slate-50 text-slate-500 uppercase font-black tracking-widest border-b">
                                <tr>
                                    <th class="py-3 px-4 text-left w-10">Inc.</th>
                                    <th class="py-3 px-4 text-left">Topic Name</th>
                                    <th class="py-3 px-2 text-center w-[60px]">From</th>
                                    <th class="py-3 px-2 text-center w-[60px]">To</th>
                                    <th class="py-3 px-4 text-left max-w-[150px]">Subject</th>
                                    <th class="py-3 px-4 text-left max-w-[150px]">Lesson</th>
                                    <th class="py-3 px-4 text-center">Same</th>
                                </tr>
                            </thead>
                            <tbody id="bulk-table-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div
                class="flex flex-wrap items-center justify-end gap-2 pt-4 border-t sticky bottom-0 bg-white py-4 px-6 -mx-6">
                <button type="button" id="cancel-topic-modal-btn"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancel</button>

                <div id="import-all-container" class="hidden">
                    <button type="button" id="import-all-btn"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg flex items-center shadow-lg transform active:scale-95 transition-all">
                        <span class="material-symbols-outlined mr-2">upload</span>
                        Import All Topics
                    </button>
                </div>

                <button type="button" id="clear-filters-btn"
                    class="bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold py-2 px-4 rounded-lg flex items-center mr-auto manual-only">
                    <span class="material-symbols-outlined mr-2">filter_alt_off</span>
                    Clear Filters
                </button>

                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg manual-only">Save
                    Topic</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="delete-topic-confirm-modal"
    class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-[200] p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-sm mx-4 p-6">
        <div class="flex flex-col items-center text-center">
            <div class="bg-red-100 p-3 rounded-full"><span
                    class="material-symbols-outlined text-4xl text-red-600">warning</span></div>
            <h3 class="text-xl font-semibold mt-4 text-gray-800">Delete Topic</h3>
            <p class="text-gray-600 mt-2">Are you sure you want to delete this topic?</p>
        </div>
        <div class="flex justify-center mt-6 space-x-4"><button type="button" id="cancel-topic-delete-btn"
                class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg">Cancel</button><button
                type="button" id="confirm-topic-delete-btn"
                class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg">Delete</button></div>
    </div>
</div>
