<div class="space-y-6">
    <!-- Header/Filters Area -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Question Analysis</h2>
                <p class="text-gray-500 text-sm">Track and analyze individual question performance across exams.</p>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <button id="btn-wrong-exam" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">error</span> Create Wrong Exam
                </button>
                <button id="btn-unattempted-exam" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">radio_button_unchecked</span> Create Unattempted Exam
                </button>
                <button id="btn-mixed-exam" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">shuffle</span> Mixed Exam
                </button>
            </div>
        </div>

        <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Subject</label>
                <select id="filter-subject" class="w-full border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="">All Subjects</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Lesson</label>
                <select id="filter-lesson" class="w-full border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500" disabled>
                    <option value="">All Lessons</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Topic</label>
                <select id="filter-topic" class="w-full border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500" disabled>
                    <option value="">All Topics</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Stats Summary -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">
                    <span class="material-symbols-outlined">quiz</span>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Total Questions</p>
                    <h3 id="stat-total-questions" class="text-2xl font-bold text-gray-800">0</h3>
                </div>
            </div>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-green-50 text-green-600 rounded-xl flex items-center justify-center">
                    <span class="material-symbols-outlined">check_circle</span>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Correct</p>
                    <h3 id="stat-correct" class="text-2xl font-bold text-gray-800">0</h3>
                </div>
            </div>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center">
                    <span class="material-symbols-outlined">cancel</span>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Wrong</p>
                    <h3 id="stat-wrong" class="text-2xl font-bold text-gray-800">0</h3>
                </div>
            </div>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center">
                    <span class="material-symbols-outlined">insights</span>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Avg accuracy</p>
                    <h3 id="stat-accuracy" class="text-2xl font-bold text-gray-800">0%</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Questions Table -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex items-center justify-between">
            <h3 class="font-bold text-gray-800">Question Performance List</h3>
            <div id="loading-spinner" class="hidden">
                 <span class="material-symbols-outlined animate-spin text-blue-600">sync</span>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                    <tr>
                        <th class="px-6 py-4 font-semibold">Question</th>
                        <th class="px-6 py-4 font-semibold text-center">Attempts</th>
                        <th class="px-6 py-4 font-semibold text-center text-green-600">Correct</th>
                        <th class="px-6 py-4 font-semibold text-center text-red-600">Wrong</th>
                        <th class="px-6 py-4 font-semibold text-center text-gray-400">Skipped</th>
                        <th class="px-6 py-4 font-semibold text-right">Accuracy</th>
                    </tr>
                </thead>
                <tbody id="question-list-body" class="divide-y divide-gray-100 text-sm">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</div>
