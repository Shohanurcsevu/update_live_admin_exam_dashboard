<div class="space-y-6">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Revision Planner</h2>
                <p class="text-gray-500 text-sm">Automated revision schedule based on your performance and goals.</p>
            </div>
            <div class="flex items-center gap-2">
                <div id="loading-spinner" class="hidden mr-2">
                    <span class="material-symbols-outlined animate-spin text-blue-600">sync</span>
                </div>
                <!-- Scope Toggle -->
                <div class="flex bg-gray-100 p-1 rounded-xl mr-4">
                    <button id="scope-topic"
                        class="scope-btn px-4 py-2 text-xs font-bold rounded-lg transition-all bg-white text-blue-600 shadow-sm whitespace-nowrap"
                        data-scope="topic">Topic View</button>
                    <button id="scope-exam"
                        class="scope-btn px-4 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        data-scope="exam">Exam View</button>
                </div>
                <div class="flex bg-gray-100 p-1 rounded-xl overflow-x-auto no-scrollbar max-w-full">
                    <button
                        class="period-btn px-4 py-2 text-xs font-bold rounded-lg transition-all bg-white text-blue-600 shadow-sm whitespace-nowrap"
                        data-period="all">Recommended</button>
                    <button
                        class="period-btn px-4 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        data-period="today">Today</button>
                    <button
                        class="period-btn px-4 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        data-period="yesterday">Yesterday</button>
                    <button
                        class="period-btn px-4 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        data-period="last_2_days">2 Days</button>
                    <button
                        class="period-btn px-4 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        data-period="last_3_days">3 Days</button>
                    <button
                        class="period-btn px-4 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        data-period="last_7_days">Week</button>
                    <button
                        class="period-btn px-4 py-2 text-xs font-bold rounded-lg transition-all text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        data-period="month">Month</button>
                </div>
            </div>
        </div>

        <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
            <select id="filter-subject" class="w-full border-gray-200 rounded-lg text-sm focus:ring-blue-500">
                <option value="">All Subjects</option>
            </select>
            <select id="filter-lesson" class="w-full border-gray-200 rounded-lg text-sm focus:ring-blue-500" disabled>
                <option value="">All Lessons</option>
            </select>
            <select id="filter-topic" class="w-full border-gray-200 rounded-lg text-sm focus:ring-blue-500" disabled>
                <option value="">All Topics</option>
            </select>
            <select id="filter-exam" class="w-full border-gray-200 rounded-lg text-sm focus:ring-blue-500" disabled>
                <option value="">All Exams</option>
            </select>
            <div class="flex bg-gray-50 p-1 rounded-lg border border-gray-100 items-center justify-around">
                <button id="filter-weak-only"
                    class="flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-red-600 shadow-sm border border-red-50">Weak
                    Only</button>
                <button id="filter-all" class="flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500">All
                    Topics</button>
            </div>
            <button id="refresh-recommendations"
                class="flex items-center justify-center gap-2 px-4 py-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-sm font-bold transition-all">
                <span class="material-symbols-outlined text-lg">refresh</span> Refresh Plan
            </button>
        </div>
    </div>

    <!-- Summary Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="bg-gradient-to-br from-red-500 to-red-600 p-5 rounded-2xl shadow-md text-white">
            <p class="text-white/80 text-xs font-bold uppercase tracking-widest mb-1">Weakest Topic</p>
            <h3 id="stat-weakest-topic" class="text-xl font-black truncate">Calculating...</h3>
            <p id="stat-weakest-reason" class="text-white/70 text-xs mt-2 italic">Based on last 30 days performance</p>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-xl flex items-center justify-center">
                    <span class="material-symbols-outlined">priority_high</span>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Overdue Revision</p>
                    <h3 id="stat-overdue-count" class="text-2xl font-bold text-gray-800">0</h3>
                </div>
            </div>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center">
                    <span class="material-symbols-outlined">trending_up</span>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Overall Accuracy</p>
                    <h3 id="stat-avg-accuracy" class="text-2xl font-bold text-gray-800">0%</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Recommendation List -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-6 border-b border-gray-100">
            <h3 class="font-bold text-gray-800">Priority Revision List</h3>
        </div>
        <div id="recommendation-list" class="divide-y divide-gray-50">
            <!-- Rows loaded dynamically -->
            <div class="p-12 text-center text-gray-400">
                <span class="material-symbols-outlined text-4xl mb-2 animate-pulse">analytics</span>
                <p>Analyzing your performance...</p>
            </div>
        </div>
    </div>
</div>
