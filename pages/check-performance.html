<div id="toast-container" class="fixed top-5 right-5 z-[200]"></div>
<div class="bg-white p-4 sm:p-6 pb-6 rounded-lg shadow-md">
    <div class="mb-4">
        <h2 class="text-2xl font-bold text-gray-800">Check Performance</h2>
        <p class="text-gray-500">Filter and review past exam attempts.</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 p-4 border rounded-lg bg-gray-50">
        <div><label for="subject-filter" class="block text-sm font-medium text-gray-700">Subject</label><select
                id="subject-filter"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm"></select></div>
        <div><label for="lesson-filter" class="block text-sm font-medium text-gray-700">Lesson</label><select
                id="lesson-filter"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm"
                disabled></select></div>
        <div><label for="topic-filter" class="block text-sm font-medium text-gray-700">Topic</label><select
                id="topic-filter"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm"
                disabled></select></div>
    </div>
    <div id="attempts-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Attempts will be loaded here as cards -->
    </div>

    <div id="load-more-container" class="mt-8 flex justify-center hidden">
        <button id="load-more-btn"
            class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-all flex items-center gap-2">
            <span class="material-symbols-outlined">expand_more</span> Load More
        </button>
    </div>

    <div id="no-attempts-message" class="hidden text-center py-10">
        <p class="text-gray-500">No attempts found for the selected filters.</p>
    </div>
</div>
