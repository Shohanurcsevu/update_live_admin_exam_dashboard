<div class="space-y-6 animate-fade-in pb-10">
    <!-- Header & Filter Bar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white/60 backdrop-blur-xl p-6 rounded-[2rem] border border-white shadow-sm">
        <div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                <span class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <span class="material-symbols-outlined text-white">rss_feed</span>
                </span>
                Post Monitor
            </h1>
            <p class="text-slate-500 text-xs font-medium mt-1 ml-13">Track and manage monitored Facebook posts</p>
        </div>

        <div class="flex items-center gap-3">
            <!-- Author Filter -->
            <div class="relative group min-w-[200px]">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 text-lg transition-colors group-focus-within:text-indigo-500">person_search</span>
                <select id="author-filter" class="w-full bg-slate-50 border border-slate-100 rounded-2xl pl-11 pr-4 py-3 text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-indigo-500/5 focus:border-indigo-300 transition-all appearance-none cursor-pointer">
                    <option value="">All Authors</option>
                    <!-- Authors will be loaded here -->
                </select>
                <span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 text-lg pointer-events-none">expand_more</span>
            </div>
            
            <button id="add-post-btn" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl flex items-center gap-2 text-sm font-black transition-all active:scale-95 shadow-lg shadow-indigo-200">
                <span class="material-symbols-outlined text-lg">add</span>
                Add New Post
            </button>
            <button id="refresh-posts-btn" class="w-12 h-12 bg-white border border-slate-100 rounded-2xl flex items-center justify-center text-slate-500 hover:text-indigo-600 hover:border-indigo-100 hover:bg-indigo-50/30 transition-all active:scale-95 shadow-sm" title="Refresh">
                <span class="material-symbols-outlined">refresh</span>
            </button>
        </div>
    </div>

    <!-- Posts Grid -->
    <div id="posts-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Posts will be injected here -->
        <div class="col-span-full py-20 flex flex-col items-center justify-center text-slate-400 bg-white/40 rounded-[2rem] border border-dashed border-slate-200">
            <span class="material-symbols-outlined text-6xl mb-4 animate-pulse">cloud_download</span>
            <p class="font-bold tracking-tight">Syncing latest posts...</p>
        </div>
    </div>

    <!-- Pagination -->
    <div id="load-more-container" class="hidden flex justify-center pt-4">
        <button id="load-more-btn" class="group relative px-8 py-4 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md hover:border-indigo-100 transition-all active:scale-95 overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-r from-indigo-50/0 via-indigo-50/50 to-indigo-50/0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000"></div>
            <span class="relative flex items-center gap-3 text-sm font-black text-slate-600 group-hover:text-indigo-600">
                Load More Posts
                <span class="material-symbols-outlined text-lg">expand_more</span>
            </span>
        </button>
    </div>

    <!-- Post Modal -->
    <div id="post-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm -z-10 animate-fade-in modal-overlay"></div>
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl border border-white/50 overflow-hidden animate-scale-up">
            <div class="p-8">
                <div class="flex items-center justify-between mb-8">
                    <h2 id="modal-title" class="text-2xl font-black text-slate-800 tracking-tight">Add New Post</h2>
                    <button class="modal-close-btn w-10 h-10 rounded-xl bg-slate-50 text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-all">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                
                <form id="post-form" class="space-y-6">
                    <input type="hidden" id="post-id">
                    
                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest px-2">Author Name</label>
                        <input type="text" id="post-author" required class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-indigo-500/5 focus:border-indigo-300 transition-all placeholder:text-slate-300" placeholder="e.g. John Doe">
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest px-2">Post Content</label>
                        <textarea id="post-body" required rows="5" class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-indigo-500/5 focus:border-indigo-300 transition-all placeholder:text-slate-300 resize-none" placeholder="What's on your mind?"></textarea>
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest px-2">Source URL (Optional)</label>
                        <input type="url" id="post-url" class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-sm font-bold text-slate-700 outline-none focus:ring-4 focus:ring-indigo-500/5 focus:border-indigo-300 transition-all placeholder:text-slate-300" placeholder="https://facebook.com/posts/...">
                    </div>

                    <div class="flex items-center gap-3 bg-slate-50 p-4 rounded-2xl">
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="post-telegram" class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                        </label>
                        <span class="text-xs font-black text-slate-600 uppercase tracking-widest">Mark as Telegram Sent</span>
                    </div>

                    <div class="pt-4">
                        <button type="submit" id="save-post-btn" class="w-full bg-slate-900 hover:bg-indigo-600 text-white py-4 rounded-2xl text-sm font-black transition-all active:scale-95 shadow-xl shadow-slate-200">
                            Save Post
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Empty State (Template) -->
    <template id="empty-state-template">
        <div class="col-span-full py-24 flex flex-col items-center justify-center text-center">
            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-4xl text-slate-300">post_add</span>
            </div>
            <h3 class="text-xl font-bold text-slate-800">No posts found</h3>
            <p class="text-slate-500 text-sm mt-2 max-w-xs">We couldn't find any posts matching your criteria. Try changing the filter or refresh the page.</p>
        </div>
    </template>
</div>
