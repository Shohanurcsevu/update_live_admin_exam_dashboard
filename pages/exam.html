<!-- Toast Notification Container -->
<div id="toast-container"
    class="fixed top-24 left-1/2 -translate-x-1/2 z-[200] flex flex-col items-center pointer-events-none"></div>

<style>
    @keyframes fade-in-down {
        0% {
            opacity: 0;
            transform: translateY(-20px);
        }

        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<!-- Main Content -->
<div class="bg-white p-4 sm:p-6 pb-6 rounded-lg shadow-md">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 space-y-4 sm:space-y-0">
        <h2 class="text-2xl font-bold text-gray-800">Manage Exams</h2>
        <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
            <button id="main-clear-filters-btn"
                class="flex items-center justify-center gap-2 px-4 py-2 bg-amber-100 text-amber-700 rounded-lg hover:bg-amber-200 transition font-bold text-sm shadow-sm">
                <span class="material-symbols-outlined text-lg">filter_alt_off</span>
                Clear Filters
            </button>
            <button id="create-exam-btn"
                class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center shadow">
                <span class="material-symbols-outlined mr-2">add</span>
                Create Exam
            </button>
        </div>
    </div>

    <!-- Stats Bar -->
    <div
        class="flex flex-wrap items-center justify-between gap-3 mb-6 bg-blue-50/50 p-4 rounded-xl border border-blue-100">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                <span class="material-symbols-outlined text-blue-600">assignment</span>
            </div>
            <div>
                <p class="text-[10px] uppercase tracking-wider font-bold text-blue-500 leading-none">Total Exams</p>
                <h3 class="text-xl font-black text-blue-900 leading-tight">
                    <span id="current-count">0</span> / <span id="total-count">0</span>
                </h3>
            </div>
        </div>
        <div class="hidden sm:flex items-center gap-2 text-sm text-blue-700 font-medium">
            <span class="material-symbols-outlined">info</span>
            Manage your exam bank here
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div><label for="subject-filter" class="block text-sm font-medium text-gray-700">Filter by
                Subject</label><select id="subject-filter"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm"></select></div>
        <div><label for="lesson-filter" class="block text-sm font-medium text-gray-700">Filter by Lesson</label><select
                id="lesson-filter"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm"
                disabled></select></div>
        <div><label for="topic-filter" class="block text-sm font-medium text-gray-700">Filter by Topic</label><select
                id="topic-filter"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm"
                disabled></select></div>
    </div>

    <!-- Desktop View: Table -->
    <div class="hidden md:block overflow-x-auto border border-gray-100 rounded-xl mt-6">
        <table class="min-w-full bg-white">
            <thead class="bg-gray-50 text-gray-500 uppercase text-[11px] font-black tracking-widest border-b">
                <tr>
                    <th class="py-4 px-6 text-left">Exam Title</th>
                    <th class="py-4 px-6 text-left">Hierarchy</th>
                    <th class="py-4 px-6 text-center">Duration</th>
                    <th class="py-4 px-6 text-center">Marks</th>
                    <th class="py-4 px-6 text-center">Actions</th>
                </tr>
            </thead>
            <tbody id="exams-table-body" class="text-gray-600 text-sm font-medium divide-y divide-gray-50"></tbody>
        </table>
    </div>

    <!-- Mobile View: Cards -->
    <div id="exams-card-view" class="md:hidden grid grid-cols-1 gap-4 mt-6 pb-2">
        <!-- Cards will be injected here -->
    </div>

    <!-- Load More Button -->
    <div id="load-more-container" class="mt-6 mb-4 flex justify-center hidden px-4 sm:px-0">
        <button id="load-more-btn"
            class="w-full sm:w-auto bg-white border-2 border-blue-600 text-blue-600 hover:bg-blue-50 font-bold py-3 px-10 rounded-xl flex items-center justify-center shadow-sm active:scale-95 transition-all">
            <span class="material-symbols-outlined mr-2">expand_more</span>
            Load More Exams
        </button>
    </div>
</div>

<!-- Add/Edit Exam Modal -->
<div id="exam-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-[200] p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
        <div class="flex justify-between items-center p-4 border-b">
            <h3 id="exam-modal-title" class="text-xl font-semibold">Add New Exam</h3>
            <button id="close-exam-modal-btn" class="text-gray-500 hover:text-gray-800"><span
                    class="material-symbols-outlined">close</span></button>
        </div>
        <form id="exam-form" class="p-6 space-y-4 overflow-y-auto">
            <input type="hidden" id="exam-id" name="id">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label for="modal-subject-selector"
                        class="block text-sm font-medium text-gray-700">Subject</label><select
                        id="modal-subject-selector" name="subject_id" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></select></div>
                <div><label for="modal-lesson-selector"
                        class="block text-sm font-medium text-gray-700">Lesson</label><select id="modal-lesson-selector"
                        name="lesson_id" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"
                        disabled></select></div>
                <div><label for="modal-topic-selector"
                        class="block text-sm font-medium text-gray-700">Topic</label><select id="modal-topic-selector"
                        name="topic_id" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"
                        disabled></select></div>
            </div>
            <div>
                <label for="exam-title" class="block text-sm font-medium text-gray-700">Exam Title</label>
                <input type="text" id="exam-title" name="exam_title" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label for="duration" class="block text-sm font-medium text-gray-700">Duration
                        (Minutes)</label><input type="number" id="duration" name="duration" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></div>
                <div><label for="total-marks" class="block text-sm font-medium text-gray-700">Total Marks</label><input
                        type="number" step="0.01" id="total-marks" name="total_marks" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></div>
                <div><label for="pass-mark" class="block text-sm font-medium text-gray-700">Pass Mark</label><input
                        type="number" step="0.01" id="pass-mark" name="pass_mark" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></div>
            </div>
            <div class="hidden">
                <label for="instructions" class="block text-sm font-medium text-gray-700">Instructions</label>
                <textarea id="instructions" name="instructions" rows="4"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></textarea>
            </div>
            <div class="hidden">
                <label class="block text-sm font-medium text-gray-700">Negative Marking</label>
                <input type="text" value="0.5 for each wrong answer" readonly
                    class="mt-1 block w-full px-3 py-2 border-gray-200 bg-gray-100 rounded-md shadow-sm">
            </div>

            <!-- Import Questions Section -->
            <div class="border-t pt-4 mt-6">
                <h4 class="text-lg font-semibold text-gray-800 mb-2 flex items-center">
                    <span class="material-symbols-outlined mr-2">upload_file</span>
                    Import Questions
                </h4>
                <div class="space-y-4">
                    <div>
                        <label for="modal-questions-json" class="block text-sm font-medium text-gray-700">Paste Question
                            JSON Array</label>
                        <textarea id="modal-questions-json" rows="6"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm font-mono text-xs"
                            placeholder='[{"question":"...","options":{"A":"..."},"answer":"...","explanation":"..."}]'></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" id="preview-imported-questions-btn"
                            class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold py-1.5 px-4 rounded border transition">
                            Preview Questions
                        </button>
                    </div>
                    <!-- Preview Container -->
                    <div id="imported-questions-preview" class="hidden border rounded-md p-3 bg-gray-50">
                    </div>
                </div>
            </div>
            <div
                class="flex flex-wrap items-center justify-end gap-2 pt-4 border-t sticky bottom-0 bg-white py-4 px-6 -mx-6">
                <button type="button" id="clear-filters-btn"
                    class="bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold py-2 px-4 rounded-lg flex items-center mr-auto">
                    <span class="material-symbols-outlined mr-2">filter_alt_off</span>
                    Clear Filters
                </button>
                <button type="button" id="cancel-exam-modal-btn"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancel</button>
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Save Exam</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="delete-exam-confirm-modal"
    class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-[200] p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-sm mx-4 p-6">
        <div class="flex flex-col items-center text-center">
            <div class="bg-red-100 p-3 rounded-full"><span
                    class="material-symbols-outlined text-4xl text-red-600">warning</span></div>
            <h3 class="text-xl font-semibold mt-4 text-gray-800">Delete Exam</h3>
            <p class="text-gray-600 mt-2">Are you sure you want to delete this exam?</p>
        </div>
        <div class="flex justify-center mt-6 space-x-4"><button type="button" id="cancel-exam-delete-btn"
                class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg">Cancel</button><button
                type="button" id="confirm-exam-delete-btn"
                class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg">Delete</button></div>
    </div>
</div>
